name: Custom server CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v5
      - name: Format changed Kotlin sources
        continue-on-error: true
        run: ./gradlew ktlintFormat
      - name: Upload formatted bridge sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-bridge-sources
          path: |
            server/src/main/kotlin/eu/kanade/tachiyomi/network/NetworkHelper.kt
            server/src/main/kotlin/suwayomi/tachidesk/graphql/mutations/BridgeMutation.kt
      - name: Check style, tests, and full server JAR
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 ktlintCheck :server:test :server:downloadWebUI :server:shadowJar --stacktrace
