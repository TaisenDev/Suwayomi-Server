name: Build and publish custom Suwayomi image

on:
  push:
    branches: [master]
    tags: ['taisendev-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v5
      - name: Check style, tests, and build the server JAR
        run: |
          ./gradlew ktlintCheck :server:test :server:downloadWebUI :server:shadowJar --stacktrace
          JAR="$(find server/build -maxdepth 1 -type f -name 'Suwayomi-Server-*.jar' ! -name '*plain*' -print -quit)"
          test -n "$JAR"
          cp "$JAR" server.jar
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/taisendev/suwayomi-server
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=match,pattern=taisendev-v(.*),group=1
      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
